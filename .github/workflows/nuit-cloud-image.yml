# Builds and publishes ghcr.io/nuit-cloud/nuit-cloud-minio from Dockerfile.nuit-cloud, on a tag nuit-cloud/<release> (see NUIT-CLOUD.md). The
# only workflow in this fork: upstream's were removed so they spend no runner time. Both architectures are cross-compiled on the runner's own
# platform, so no QEMU is set up.
name: nuit-cloud image

on:
  push:
    tags: ['nuit-cloud/*']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign's keyless signature
    env:
      IMAGE: ghcr.io/nuit-cloud/nuit-cloud-minio
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: v2.6.5   # cosign 3 writes a different bundle; move to it on purpose, with whatever verifies these
      - name: Name the release
        id: release
        run: echo "release=${GITHUB_REF_NAME#nuit-cloud/}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.nuit-cloud
          platforms: linux/amd64,linux/arm64
          build-args: |
            RELEASE=${{ steps.release.outputs.release }}
            REVISION=${{ github.sha }}
          push: true
          # attached to the image in the registry: what is in it (an SBOM) and how, where and from what it was built (provenance)
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.release }}
      - name: Sign the image by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Record the digest
        run: |
          {
            echo "### ${IMAGE}:${{ steps.release.outputs.release }}"
            echo
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
